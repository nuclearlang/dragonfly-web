# The contract of the web platform (spec/web.md, ADR-0097): what every dialect of dialects/web/ must implement,
# identically. The loader refuses a dialect whose kinds, consumed decorators or plugins leave this list.
# First version (2026-11-06): the kinds of the mobile platform that make sense in a browser, with the same words,
# so an app's domain reads the same on a phone and on the web. Forms, translations, converters, AI and the local
# database come in later steps (STATUS.md).
[platform]
# the dialect a new project of this platform gets when none is named (`dragonfly new -p <platform>`)
default_dialect = "react"
name = "web"
description = "web apps in the browser through one UI library"
kinds = [
  "stateless", "stateful", "appConfig", "config", "repository", "usecase", "appcomponent", "service",
  "aggregate", "statemanager", "statemodel", "model", "component", "guard", "event", "tests",
]
# the decorators a project may write (a dialect consumes them in its templates or writes them as the target's)
decorators = [
  "repository", "get", "post", "put", "patch", "delete", "path", "query", "body",
  "stateModel", "state", "before", "after", "screen", "on", "requires", "acl",
  "mock", "test", "widget", "states",
  "key",
]
plugins = []

# Where each kind's file goes (`nuclear help layout --dialect <d>`): what `dragonfly make` and agents follow.
# {component} is the component's folder, {screen} the screen's folder (views and their managers), {file} the
# declaration's name in snake_case.
[layout]
appConfig = "config/project_config.nuc"
config = "components/{component}/config/{component}_config.nuc"
repository = "components/{component}/data/{file}.nuc"
model = "components/{component}/domain/models/{file}.nuc"
usecase = "components/{component}/domain/usecases/{file}.nuc"
service = "components/{component}/domain/services/{file}.nuc"
aggregate = "components/{component}/domain/aggregates/{file}.nuc"
appcomponent = "components/{component}/{component}_component.nuc"
statemanager = "components/{component}/presentation/{screen}/managers/{file}.nuc"
statemodel = "components/{component}/presentation/{screen}/state_models/{file}.nuc"
stateless = "components/{component}/presentation/{screen}/{file}.nuc"
stateful = "components/{component}/presentation/{screen}/{file}.nuc"
component = "shared/components/{file}.nuc"
guard = "shared/guards/{file}.nuc"
event = "shared/events/{file}.nuc"
tests = "test/{file}.nuc"

# What `dragonfly make <kind> <component> <Name>` writes at the kind's [layout] path: the smallest file of the kind that
# compiles, with a doc comment to replace by the declaration's business description (the project map shows it).
# {{Name}}: the name as given (PascalCase), {{name}}: camelCase, {{component}} / {{Component}}, {{table}}: the name in
# snake_case plural.
[skeletons]
repository = """
// The requests of {{Name}}.
@repository(path = "{{component}}")
repository {{Name}}
"""
model = """
// What {{Name}} carries.
{{Name}}
"""
usecase = """
// What {{Name}} does.
usecase {{Name}}
  exec() Result<Error, string>
    Ok("")
"""
service = """
// The rules {{Name}} gives the use cases.
service {{Name}}
"""
appcomponent = """
// What the rest of the app sees of {{component}}.
appcomponent {{Name}}
"""
statemodel = """
// The states of a screen: each field is one.
{{Name}}
  (loading: boolean)
"""
stateless = """
// What {{Name}} shows.
stateless {{Name}}
  build() Element
    div(children = "{{Name}}")
"""
stateful = """
// What {{Name}} shows and keeps.
stateful {{Name}}
  build() Element
    div(children = "{{Name}}")
"""
event = """
// What happened: {{Name}}.
event {{Name}}
"""
tests = """
// The tests of {{component}}.
tests {{Name}}
"""

# What `dragonfly gen` writes (ADR-0103): finished code from a resource's data (the values are listed in the backend
# platform's platform.toml). The web platform reads other APIs (`--source rest`); its local database is the
# repositories' `saveLocal`, not a resource of its own.
# How `gen` writes the connection of an HTTP resource: the default one, or a named one when the app has another.
[gen]
http = 'Http(baseUrl = "{{baseUrl}}")'
http_named = 'Http(connectionName = "{{name}}", baseUrl = "{{baseUrl}}")'

[[generators.component]]
kind = "appcomponent"
name = "{{Component}}Component"
merge = true
template = """
// What the screens and the other components see of {{component}}: an alias for each of its use cases.
appcomponent {{Component}}Component
"""

[[generators.resource]]
kind = "model"
each = "models"
when = "rest"
name = "{{Model}}"
template = """
// {{Model}}, as the API answers it.
{{Model}}
{{#fields}}
{{#key}}
  @key("{{key}}")
{{/key}}
  {{name}}{{#optional}}?{{/optional}}: {{type}}
{{/fields}}
"""

[[generators.resource]]
kind = "model"
when = "rest"
name = "{{Name}}Error"
template = """
// What failed with {{names}}: Dragonfly builds it with the failure's message.
{{Name}}Error
  message: string
"""

[[generators.resource]]
kind = "repository"
when = "rest"
name = "{{Name}}Repository"
template = """
// The {{names}} of the API ({{path}}): each method is an http call.
@repository(path = "{{path}}"{{#connection}}, connection = "{{connection}}"{{/connection}})
repository {{Name}}Repository
{{#actions.list}}
  @get
  {{#paged}}page(page: int) Result<{{Name}}Error, {{Page}}>{{/paged}}{{^paged}}all() Result<{{Name}}Error, {{Name}}[]>{{/paged}}

{{/actions.list}}
{{#actions.get}}
  @get(path = ":id")
  one(id: {{idType}}) Result<{{Name}}Error, {{Name}}>

{{/actions.get}}
{{#actions.search}}
  @get
  search(name: string) Result<{{Name}}Error, {{#paged}}{{Page}}{{/paged}}{{^paged}}{{Name}}[]{{/paged}}>

{{/actions.search}}
{{#actions.create}}
  @post
  create(input: {{Name}}) Result<{{Name}}Error, {{Name}}>

{{/actions.create}}
{{#actions.update}}
  @put(path = ":id")
  update(id: {{idType}}, input: {{Name}}) Result<{{Name}}Error, {{Name}}>

{{/actions.update}}
{{#actions.delete}}
  @delete(path = ":id")
  remove(id: {{idType}}) Result<{{Name}}Error, boolean>
{{/actions.delete}}
"""

[[generators.resource]]
kind = "usecase"
each = "each_action"
name = "{{UseCase}}"
template = """
{{#is.list}}
// One page of {{names}}.
usecase {{UseCase}}(repository: {{Name}}Repository)
{{#paged}}
  exec(page: int) Result<{{Name}}Error, {{Name}}[]>
    found = ~repository.page(page)
    Ok(found.{{items}})
{{/paged}}
{{^paged}}
  exec() Result<{{Name}}Error, {{Name}}[]>
    ~repository.all()
{{/paged}}
{{/is.list}}
{{#is.get}}
// One {{name}} by its id.
usecase {{UseCase}}(repository: {{Name}}Repository)
  exec(id: {{idType}}) Result<{{Name}}Error, {{Name}}>
    ~repository.one(id)
{{/is.get}}
{{#is.search}}
// The {{names}} whose name matches.
usecase {{UseCase}}(repository: {{Name}}Repository)
  exec(name: string) Result<{{Name}}Error, {{Name}}[]>
{{#paged}}
    found = ~repository.search(name)
    Ok(found.{{items}})
{{/paged}}
{{^paged}}
    ~repository.search(name)
{{/paged}}
{{/is.search}}
{{#is.create}}
// Adds a {{name}}.
usecase {{UseCase}}(repository: {{Name}}Repository)
  exec(input: {{Name}}) Result<{{Name}}Error, {{Name}}>
    ~repository.create(input)
{{/is.create}}
{{#is.update}}
// Changes a {{name}}.
usecase {{UseCase}}(repository: {{Name}}Repository)
  exec(id: {{idType}}, input: {{Name}}) Result<{{Name}}Error, {{Name}}>
    ~repository.update(id, input)
{{/is.update}}
{{#is.delete}}
// Removes a {{name}}.
usecase {{UseCase}}(repository: {{Name}}Repository)
  exec(id: {{idType}}) Result<{{Name}}Error, boolean>
    ~repository.remove(id)
{{/is.delete}}
"""

[[generators.resource]]
kind = "appcomponent"
merge = true
name = "{{Component}}Component"
template = """
// What the screens and the other components see of {{component}}: an alias for each of its use cases.
appcomponent {{Component}}Component
{{#each_action}}
  {{alias}}() = {{UseCase}}.exec
{{/each_action}}
"""

[[generators.resource]]
kind = "statemodel"
when = "screen"
name = "{{Names}}State"
template = """
// The states of the {{names}} screen: each field is one.
{{Names}}State
  (full: {{Name}}[], error: {{Name}}Error, loading: boolean)
"""

[[generators.resource]]
kind = "statemanager"
when = "screen"
name = "{{Names}}Manager"
template = """
// The state of the {{names}} screen: it loads the first page when it is created.
@stateModel({{Names}}State)
statemanager {{Names}}Manager
  ({{component}}: {{Component}}Component)
    load({{#listArg}}1{{/listArg}})

  @state({{Names}}State.loading)
  loading()

  @before(loading)
  @state({{Names}}State.full)
  load({{listParam}}) Result<{{Name}}Error, {{Name}}[]>
    ~{{component}}.list{{Names}}({{listArg}})
"""

[[generators.resource]]
kind = "stateless"
when = "screen"
name = "{{Names}}Screen"
template = """
// The {{names}}, as a list.
@screen(route = "/{{names|kebab}}", providers = [{{Names}}Manager])
stateless {{Names}}Screen
  build() Element
    main(
      children = [
        h1(children = "{{Names}}"),
        {{Names}}StateBuilder(
          loading = () => p(children = "Loading..."),
          full = (items) => ul(children = items.map((item) => li(key = item.id, children = {{#labelText}}item.{{label}}{{/labelText}}{{^labelText}}"${item.{{label}}}"{{/labelText}}))),
          error = (e) => p(className = "error", children = e.message),
        ),
      ],
    )
"""

[[generators.resource]]
kind = "tests"
when = "actions.list"
name = "{{Names}}Test"
template = """
// The tests of {{names}}: the repository is a mock; everything else is the real code.
@mock([{{Name}}Repository])
{{Names}}Test
  beforeEach()
{{#paged}}
    when({{Name}}Repository.page).thenReturn(Ok({{pageSample}}))
{{/paged}}
{{^paged}}
    when({{Name}}Repository.all).thenReturn(Ok([]))
{{/paged}}

  @test("List{{Names}} answers the {{names}} of the API")
  lists()
    result = ~List{{Names}}.exec({{#listArg}}1{{/listArg}})
    expect(okOf(result)).toEqual({{#paged}}[]{{/paged}}{{^paged}}[]{{/paged}})
"""
